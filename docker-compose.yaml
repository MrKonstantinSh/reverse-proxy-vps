name: reverse-proxy

services:
  caddy:
    image: caddy:2.11.4
    restart: unless-stopped
    init: true
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 512m
    pids_limit: 256
    environment:
      DOMAIN: ${DOMAIN:?Укажите домен в файле .env}
      ACME_EMAIL: ${ACME_EMAIL:?Укажите ACME_EMAIL в файле .env}
      OPENHANDS_USER: ${OPENHANDS_USER:?Укажите логин OpenHands в файле .env}
      OPENHANDS_PASSWORD: ${OPENHANDS_PASSWORD:?Укажите пароль OpenHands в файле .env}
    entrypoint:
      - /bin/sh
      - /usr/local/bin/caddy-entrypoint.sh
    command:
      - caddy
      - run
      - --config
      - /etc/caddy/Caddyfile
      - --adapter
      - caddyfile
    ports:
      - target: 80
        published: 80
        protocol: tcp
      - target: 443
        published: 443
        protocol: tcp
      - target: 443
        published: 443
        protocol: udp
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./sites:/etc/caddy/sites:ro
      - ./scripts/caddy-entrypoint.sh:/usr/local/bin/caddy-entrypoint.sh:ro
      - caddy_data:/data
      - caddy_config:/config
    tmpfs:
      - /tmp
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -qO- http://127.0.0.1:2019/config/ >/dev/null || exit 1",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    networks:
      - proxy

networks:
  proxy:
    external: true
    name: proxy

volumes:
  caddy_data:
    external: true
    name: caddy_data
  caddy_config:
    external: true
    name: caddy_config
