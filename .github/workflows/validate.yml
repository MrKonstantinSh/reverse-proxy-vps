name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  compose:
    runs-on: ubuntu-latest
    env:
      DOMAIN: example.com
      ACME_EMAIL: ops@example.com
      OPENHANDS_USER: ci
      OPENHANDS_PASSWORD: ci-placeholder-password
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Render Compose config
        run: docker compose -f docker-compose.yaml config --quiet

      - name: Validate Caddyfile
        run: |
          docker run --rm --entrypoint /bin/sh \
            -e DOMAIN \
            -e ACME_EMAIL \
            -e OPENHANDS_USER \
            -e OPENHANDS_PASSWORD \
            -v "$PWD/Caddyfile:/etc/caddy/Caddyfile:ro" \
            -v "$PWD/sites:/etc/caddy/sites:ro" \
            -v "$PWD/scripts/caddy-entrypoint.sh:/usr/local/bin/caddy-entrypoint.sh:ro" \
            caddy:2.11.4 \
            /usr/local/bin/caddy-entrypoint.sh \
            caddy validate --config /etc/caddy/Caddyfile
